name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
      release_title:
        description: 'Release Title'
        required: false
      release_notes:
        description: 'Release Notes / Changelog'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          fi
          echo "Using consistent signing keystore."

      - name: Run Backend Tests
        run: |
          cd server
          npm ci
          npm test
          cd ..

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Determine Version, Tag and Release Notes
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VNAME=$(echo "$TAG" | sed -e 's/^[vV]//')
            VCODE=${{ github.run_number }}
            TITLE="${{ github.event.inputs.release_title }}"
            [ -z "$TITLE" ] && TITLE="Release $TAG"
            NOTES="${{ github.event.inputs.release_notes }}"
            [ -z "$NOTES" ] && NOTES="Manual release $TAG."
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VNAME=$(echo "$TAG" | sed -e 's/^[vV]//')
            VCODE=${{ github.run_number }}
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG")
            [ -z "$TAG_MSG" ] && TAG_MSG=$(git log -1 --pretty=%B)
            TITLE="Release $TAG"
            NOTES="${TAG_MSG:-Automated release for $TAG}"
          else
            TAG="v1.1.${{ github.run_number }}"
            VNAME="1.1.${{ github.run_number }}"
            VCODE=${{ github.run_number }}
            COMMIT_TITLE=$(git log -1 --pretty=%s)
            COMMIT_BODY=$(git log -1 --pretty=%B)
            TITLE="Update v1.1.${{ github.run_number }}: $COMMIT_TITLE"
            NOTES="### 🚀 What's New in v1.1.${{ github.run_number }}

$COMMIT_BODY

---
*Automated build from commit [${GITHUB_SHA::7}](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}) on main branch.*"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release_info.outputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" Yosan-Update.apk
          echo "apk_path=Yosan-Update.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ steps.release_info.outputs.notes }}
          draft: false
          prerelease: false
          files: Yosan-Update.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
